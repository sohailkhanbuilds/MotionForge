[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionforge"
version = "0.1.0"
description = "Experimental markerless human motion capture to BVH"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "opencv-python==4.10.0.84",
  "numpy>=1.26,<2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["motionforge*"]
